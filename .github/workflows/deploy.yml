name: Deploy to AWS EC2

# Trigger: run only on a push to the master branch
on:
  push:
    branches:
      - master # If your main branch is called main, change this to main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Commands GitHub will run on your server
          script: |
            cd ~/notes
            git pull origin master
            docker compose build
            docker compose up -d
            docker system prune -f
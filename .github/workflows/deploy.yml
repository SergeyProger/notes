name: Deploy to AWS EC2

# Триггер: запускать только при пуше в ветку master
on:
  push:
    branches:
      - master # Если ваша основная ветка называется main, поменяйте на main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Команды, которые GitHub выполнит на вашем сервере
          script: |
            cd ~/notes
            git pull origin master
            docker compose build
            docker compose up -d
            docker system prune -f